name: Release

# 推送 v* tag 触发：质量门禁 → npm 发布 → Docker 多架构镜像（GHCR + Docker Hub）→ GitHub Release。
# 发版方式：更新 package.json version 与 CHANGELOG.md 后，git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  packages: write # 推送 GHCR 镜像
  id-token: write # npm provenance（npm 页面展示构建来源证明）

jobs:
  test:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本不写死，读取 package.json 的 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tag 与 package.json 版本必须一致，防止发错版本（E2E 由 main 分支的 CI 每次 push 把关，此处从快）
      - name: Verify tag matches package.json version
        run: node -e "const v=require('./package.json').version, t=process.env.GITHUB_REF_NAME.slice(1); if(v!==t){console.error('tag v'+t+' 与 package.json 版本 '+v+' 不一致');process.exit(1)}else{console.log('version '+v+' OK')}"

      - name: Typecheck (app + tests)
        run: pnpm typecheck

      - name: Typecheck (web)
        run: pnpm typecheck:web

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish-npm:
    name: 发布 npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly 钩子自动执行 pnpm build（dist + public）
      - name: Publish
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  # 双架构拆成两个「原生」runner 并行构建：amd64 跑 x64 真机，arm64 跑 GitHub 为公开仓库
  # 免费提供的 arm64 真机（ubuntu-24.04-arm）。全程不使用 QEMU —— 曾用 QEMU 模拟 arm64，
  # node 会因模拟器不支持其指令集而 core dump（qemu: uncaught target signal 4），
  # 使 pnpm install 永久挂起（见 run 34867793069，15 分钟零输出后被取消）。
  # 两个架构先各推「带 -<arch> 后缀」的标签，由 docker-manifest 合并成多架构 manifest。
  docker:
    name: 构建 Docker 镜像 (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 镜像名必须全小写（github.repository 原样是 wcsjun/PolyMock）
      - name: Compute lowercase image names
        run: |
          echo "IMAGE_GHCR=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_HUB=docker.io/${DOCKERHUB_USERNAME,,}/polymock" >> "$GITHUB_ENV"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # latest=false 关掉自动 latest，靠下面显式的 raw 标签生成；onlatest=true 让后缀
      # 也作用到 latest，两个架构各自得到 latest-amd64 / latest-arm64，避免并发抢写 :latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_HUB }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # 把两个架构的单架构镜像合并成多架构 manifest list：docker pull 时按宿主机架构自动选择
  docker-manifest:
    name: 合并多架构 manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute lowercase image names
        run: |
          echo "IMAGE_GHCR=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_HUB=docker.io/${DOCKERHUB_USERNAME,,}/polymock" >> "$GITHUB_ENV"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # 这里的标签（version / major.minor / latest）必须与上面 Docker meta 的 tags 保持一致，
      # 改一处要同步改另一处。
      - name: Create manifest lists and push
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"   # v0.1.0 -> 0.1.0
          MINOR="${VERSION%.*}"            # 0.1.0  -> 0.1
          for IMG in "${IMAGE_GHCR}" "${IMAGE_HUB}"; do
            echo "==> ${IMG} : ${VERSION} / ${MINOR} / latest"
            docker buildx imagetools create \
              -t "${IMG}:${VERSION}" \
              -t "${IMG}:${MINOR}" \
              -t "${IMG}:latest" \
              "${IMG}:${VERSION}-amd64" \
              "${IMG}:${VERSION}-arm64"
          done

  github-release:
    name: 创建 GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 从 CHANGELOG.md 提取当前版本段落作为 Release 说明；未命中时回退为简短说明。
      # 用 indexOf 定位而非正则：避免正则反斜杠在 YAML/bash/JS 多层转义中的歧义
      # 截断点取「下一个版本段落」与「本版本的链接定义行」中靠前者：CHANGELOG 只含一段
      # 版本时前者不存在（indexOf 返回 -1），不做这层兜底会把末尾的 [x.y.z]: https://... 带进正文
      - name: Extract changelog for this version
        run: node -e 'const fs=require("fs");const version=process.env.GITHUB_REF_NAME.slice(1);const md=fs.readFileSync("CHANGELOG.md","utf8");const start=md.indexOf("## ["+version+"]");let body="PolyMock v"+version;if(start!==-1){const from=md.indexOf("\n",start)+1;const cuts=["\n## [","\n["+version+"]:"].map(s=>md.indexOf(s,from)).filter(i=>i!==-1);const end=cuts.length?Math.min(...cuts):md.length;body=md.slice(from,end).trim();}fs.writeFileSync("release-body.md",body);'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
